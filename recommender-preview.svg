<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Book recommendation engine preview</title><desc id="d">Diagram showing user ratings and book metadata feeding a hybrid recommendation engine.</desc>
