<text x="78" y="88" font-family="Arial" font-size="26" font-weight="700" fill="#182033">Hybrid Book Recommendation Engine</text>
<rect x="80" y="145" width="175" height="110" rx="18" fill="#eef2ff"/><text x="112" y="184" font-family="Arial" font-size="18" font-weight="700" fill="#3157d5">Reader Ratings</text><text x="110" y="215" font-family="Arial" font-size="14" fill="#5d667a">Users × Books</text>
<rect x="80" y="300" width="175" height="110" rx="18" fill="#e7f7f5"/><text x="112" y="339" font-family="Arial" font-size="18" font-weight="700" fill="#0f766e">Book Metadata</text><text x="107" y="370" font-family="Arial" font-size="14" fill="#5d667a">Genre • Author • Text</text>
